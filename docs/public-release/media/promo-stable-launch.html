<!doctype html><html lang="ko"><meta charset="utf-8"><title>국감 라이브 소개</title>
<style>html,body{margin:0;background:#071329}canvas{display:block}</style><canvas id="film"></canvas><script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),smallCanvas=new OffscreenCanvas(96,54),small=smallCanvas.getContext('2d',{willReadFrequently:true});

const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x);},lerp=(a,b,t)=>a+(b-a)*t;
let config,images={},brand,audioBuffer,timeline=[],audioInfo,encodedAudio;
function text(value,x,y,size,color=palette.white,weight=700,align='left'){g.font=`${weight} ${size}px ${font}`;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(value,x,y);}

function geometry(format){return format==='9x16'?{width:1080,height:1920,screen:[54,740,972,547],title:[64,300],titleSize:83,subtitle:[54,1690,972,150]}:{width:1920,height:1080,screen:[660,205,1190,670],title:[70,320],titleSize:62,subtitle:[70,942,1780,100]};}
function fitCrop(im,area,aspect){let w=Math.max(area[2],area[3]*aspect),h=w/aspect;if(w>im.width){w=im.width;h=w/aspect;}if(h>im.height){h=im.height;w=h*aspect;}return[Math.max(0,Math.min(im.width-w,area[0]+area[2]/2-w/2)),Math.max(0,Math.min(im.height-h,area[1]+area[3]/2-h/2)),w,h];}

}
function background(t,geo){const gradient=g.createLinearGradient(0,0,geo.width,geo.height);gradient.addColorStop(0,'#061020');gradient.addColorStop(1,'#164C85');g.fillStyle=gradient;g.fillRect(0,0,geo.width,geo.height);const glow=g.createRadialGradient(geo.width*.77+45*Math.sin(t*.23),geo.height*.5,10,geo.width*.77,geo.height*.5,geo.width*.8);glow.addColorStop(0,'#2C7EAF30');glow.addColorStop(1,'#07132900');g.fillStyle=glow;g.fillRect(0,0,geo.width,geo.height);g.drawImage(brand,54,48,56,56);text('국감 라이브',128,88,34,palette.white,700);g.fillStyle='#345571';g.fillRect(54,126,geo.width-108,3);g.fillStyle=palette.mint;g.fillRect(54,126,(geo.width-108)*clamp(t/audioBuffer.duration),3);}
function shotFor(row,p){if(row.index===4&&p>.5)return{id:'recording',focus:[190,160,850,450],p:(p-.5)*2};if(row.index===4)return{id:'caption',focus:row.focus,p:p*2};if(row.second_shot)return{id:p<.5?row.shot:row.second_shot,focus:row.focus,p:p<.5?p*2:(p-.5)*2};return{id:row.shot,focus:row.focus,p};}
window.drawFilmFrame=function(time,format='9x16'){
 const geo=geometry(format);if(canvas.width!==geo.width||canvas.height!==geo.height){canvas.width=geo.width;canvas.height=geo.height;}background(time,geo);
 const row=timeline.find(x=>time>=x.scene_start&&time<x.scene_end)||timeline.at(-1),p=clamp((time-row.scene_start)/(row.scene_end-row.scene_start)),shot=shotFor(row,p),wide=format==='16x9';
 const floating=4*Math.sin(time*.8),screen=[...geo.screen];screen[1]+=floating;picture(shot.id,shot.focus,screen,shot.p,time);
 const titleX=geo.title[0],titleY=geo.title[1],entry=smooth(p/.13),shift=16*(1-entry),last=row.index===timeline.length-1;
 g.save();g.translate(0,shift);if(row.eyebrow)text(row.eyebrow,titleX,titleY-(wide?75:90),wide?34:42,palette.muted,500);
 if(row.number){text(row.number,titleX,titleY-(wide?65:90),wide?55:72,'#6CB5CD',700);}
 row.headline.forEach((line,i)=>{let size=geo.titleSize;if(row.index===0)size=i===1?(wide?94:134):(wide?62:94);else if(last)size=wide?58:76;else if(!wide&&line.length>14)size=67;else if(wide&&line.length>14)size=45;
  g.font=`800 ${size}px ${font}`;size=Math.min(size,size*(wide?540:952)/g.measureText(line).width);const y=titleY+i*(last?(wide?91:115):(wide?94:115));text(line,titleX,y,size,i===row.headline.length-1?palette.mint:palette.white,800);
 });g.restore();
 if(!wide){const benefit=last?'검색 · 빠른 탐색 · 요약 · 후속조치':row.index<3?'내 계정으로 시작하는 국감 기록 정리':row.index===4?'회의 선택 · 자막과 녹음 · 기록 확인':'국감 기록, 필요한 대목부터';text(benefit,64,1480,33,palette.muted,500);}
 if(time>=row.start&&time<row.end&&!last){const [x,y,w,h]=geo.subtitle;rounded(x,y,w,h,20,'#041224F0');const size=wide?34:34,lineHeight=wide?39:47;row.caption.forEach((line,i)=>text(line,x+w/2,y+(h-(row.caption.length-1)*lineHeight)/2+12+i*lineHeight,size,palette.white,600,'center'));}
};
async function decodeImage(item){const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=`data:${item.mime};base64,${item.data}`;});return im;}
async function decodeAudio(encoded){const binary=atob(encoded),raw=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)raw[i]=binary.charCodeAt(i);return new OfflineAudioContext(2,1,48000).decodeAudioData(raw.buffer);}
function rawBytes(encoded){const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;}
function buildTimeline(durations,seconds=null){let cursor=config.lead_seconds;timeline=config.clips.map((clip,index)=>{const row={...clip,index,start:cursor,end:cursor+durations[index]};cursor=row.end+(index<config.clips.length-1?config.gap_seconds:0);return row;});const total=seconds??Math.ceil((cursor+config.tail_seconds)*config.fps)/config.fps;if(total<cursor||total>cursor+10)throw Error('Use the completed introduction audio with this timeline.');timeline.forEach((row,i)=>{row.scene_start=i===0?0:(timeline[i-1].end+row.start)/2;row.scene_end=i===timeline.length-1?total:(row.end+timeline[i+1].start)/2;});return total;}
function reuseReferenceTimeline(seconds){const cached=config.reference_timeline;if(!cached)return;if(cached.fps!==config.fps||Math.abs(cached.seconds-seconds)>1e-6||cached.clips.length!==config.clips.length)throw Error('Reference timeline does not match the completed audio.');cached.clips.forEach((row,i)=>{if(!['start','end','scene_start','scene_end'].every(k=>Number.isFinite(row[k]))||row.start<row.scene_start||row.end<row.start||row.scene_end<row.end||row.scene_start<0||row.scene_end>seconds+1e-6||i===0&&row.scene_start!==0||i>0&&row.scene_start!==cached.clips[i-1].scene_end)throw Error('Invalid reference timing');});timeline=config.clips.map((clip,index)=>({...clip,index,...cached.clips[index]}));}
async function mixAudio(clips,music){const seconds=buildTimeline(clips.map(x=>x.duration)),ctx=new OfflineAudioContext(2,Math.round(seconds*48000),48000);
 function add(buffer,when,offset,duration,volume,fadeIn=0,fadeOut=0){const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=buffer;source.playbackRate.value=1;source.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(fadeIn?0:volume,when);if(fadeIn)gain.gain.linearRampToValueAtTime(volume,when+fadeIn);if(fadeOut){gain.gain.setValueAtTime(volume,when+duration-fadeOut);gain.gain.linearRampToValueAtTime(0,when+duration);}source.start(when,offset,duration);}
 clips.forEach((clip,i)=>{let peak=0;for(let c=0;c<clip.numberOfChannels;c++)for(const x of clip.getChannelData(c))peak=Math.max(peak,Math.abs(x));if(peak<.005)throw Error('Empty narration');add(clip,timeline[i].start,0,clip.duration,.5/peak);});
 if(music.duration<29.6)throw Error('Music-only tail missing');for(let when=0;when<seconds;when+=5.15){const length=Math.min(5.6,seconds-when),fade=Math.min(.45,length/3);add(music,when,24,length,.5,fade,fade);}
 const buffer=await ctx.startRendering();let peak=0,sum=0,clipped=0;for(let c=0;c<buffer.numberOfChannels;c++)for(const x of buffer.getChannelData(c)){peak=Math.max(peak,Math.abs(x));sum+=x*x;if(Math.abs(x)>=1)clipped++;}audioInfo={seconds:buffer.duration,playback_rate:1,sample_peak_dbfs:20*Math.log10(peak),rms_dbfs:10*Math.log10(sum/(buffer.length*buffer.numberOfChannels)),samples_at_or_above_full_scale:clipped,source_music_seconds:[24,29.6],speaker_playback:false,measurement:'Rendered PCM sample peak/RMS; not true peak or LUFS.'};return buffer;
}
window.prepareFilm=async payload=>{config=payload.config;for(const[id,item]of Object.entries(payload.images))images[id]=await decodeImage(item);brand=await decodeImage(payload.brand);if(payload.encodedAudio){const source=payload.encodedAudio;encodedAudio={channels:source.channels,timescale:source.timescale,description:rawBytes(source.description),samples:source.samples.map(x=>({...x,data:rawBytes(x.data)}))};audioBuffer={duration:source.video_seconds,length:Math.round(source.video_seconds*48000)};buildTimeline(config.clips.map(x=>x.seconds),audioBuffer.duration);reuseReferenceTimeline(audioBuffer.duration);audioInfo={seconds:audioBuffer.duration,playback_rate:1,reused_completed_audio:true,reused_reference_timeline:!!config.reference_timeline,encoded_aac_sha256:source.encoded_sha256,aac_reencoded:false,speaker_playback:false};}else{const clips=[];for(const clip of payload.clips)clips.push(await decodeAudio(clip));audioBuffer=await mixAudio(clips,await decodeAudio(payload.music));}await document.fonts.ready;return{audio:audioInfo,timeline,frames:Math.round(audioBuffer.duration*config.fps),fps:config.fps};};
async function encodeAudio(){if(encodedAudio)return encodedAudio;let failed;const track={channels:2,timescale:48000,samples:[]},encoder=new AudioEncoder({output(chunk,metadata){if(metadata?.decoderConfig?.description)track.description=new Uint8Array(metadata.decoderConfig.description);const data=new Uint8Array(chunk.byteLength);chunk.copyTo(data);track.samples.push({data,timestamp:chunk.timestamp,duration:1024,key:true});},error(error){failed=error;}});encoder.configure({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2,bitrate:192000});
 for(let offset=0;offset<audioBuffer.length;offset+=1024){const n=Math.min(1024,audioBuffer.length-offset),data=new Float32Array(n*2);for(let c=0;c<2;c++)data.set(audioBuffer.getChannelData(c).subarray(offset,offset+n),c*n);const input=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(offset*1e6/48000),data});encoder.encode(input);input.close();if(encoder.encodeQueueSize>32)await encoder.flush();if(failed)throw failed;}
 await encoder.flush();encoder.close();if(failed)throw failed;if(!track.samples.length)throw Error('AAC output is empty');const first=track.samples[0].timestamp,trim=Math.max(0,Math.round(-first*48000/1e6));if(first>2)throw Error('AAC starts late');for(let i=0;i<track.samples.length;i++){const sample=track.samples[i];if(!sample.data.length||Math.abs(sample.timestamp-(first+i*1024*1e6/48000))>2)throw Error('AAC gap or duplicate timestamp');}if(track.samples.length*1024<audioBuffer.length+trim)throw Error('AAC output is incomplete');encodedAudio=track;return track;
}
function thumbnailHash(){small.drawImage(canvas,0,0,96,54);const pixels=[small.getImageData(0,0,96,54).data,g.getImageData(54,126,canvas.width-108,3).data];let hash=2166136261;for(const bytes of pixels)for(const b of bytes)hash=Math.imul(hash^b,16777619);return(hash>>>0).toString(16).padStart(8,'0');}
window.encodeFilm=async format=>{const geo=geometry(format),fps=config.fps,frames=Math.round(audioBuffer.duration*fps),seconds=frames/fps,track={width:geo.width,height:geo.height,timescale:90000,samples:[]},hashes=[];let failed;
 const encoder=new VideoEncoder({output(chunk,metadata){if(metadata?.decoderConfig?.description)track.description=new Uint8Array(metadata.decoderConfig.description);const data=new Uint8Array(chunk.byteLength);chunk.copyTo(data);track.samples.push({data,timestamp:chunk.timestamp,duration:90000/fps,key:chunk.type==='key'});},error(error){failed=error;}});
 encoder.configure({codec:'avc1.64002a',width:geo.width,height:geo.height,bitrate:8000000,framerate:fps,hardwareAcceleration:'prefer-software',latencyMode:'realtime',avc:{format:'avc'}});
 try{for(let i=0;i<frames;i++){window.drawFilmFrame(i/fps,format);hashes.push(thumbnailHash());const timestamp=Math.round(i*1e6/fps),frame=new VideoFrame(canvas,{timestamp,duration:Math.round((i+1)*1e6/fps)-timestamp});encoder.encode(frame,{keyFrame:i%(fps*2)===0});frame.close();if(encoder.encodeQueueSize>4)await encoder.flush();if(failed)throw failed;if(i%120===0)await window.filmProgress?.({format,frame:i,total:frames});}await encoder.flush();if(failed)throw failed;}finally{encoder.close();}
 if(track.samples.length!==frames)throw Error('Encoder dropped frames');for(let i=0;i<frames;i++)if(track.samples[i].timestamp!==Math.round(i*1e6/fps))throw Error('Encoder frame timestamp mismatch');
 const audio=await encodeAudio(),output=muxCinemaMp4({video:track,audio,seconds}),encoded=await new Promise(ok=>{const reader=new FileReader();reader.onload=()=>ok(reader.result.split(',')[1]);reader.readAsDataURL(new Blob([output],{type:'video/mp4'}));});
 return{encoded,format,width:geo.width,height:geo.height,fps,seconds,input_frames:frames,encoded_video_samples:track.samples.length,audio_samples:audio.samples.length,frame_fingerprints:hashes,consecutive_frame_fingerprint_duplicates:hashes.reduce((n,h,i)=>n+(i>0&&h===hashes[i-1]?1:0),0),fingerprint_basis:'96x54 frame thumbnail plus full-resolution progress band; not a hash of every full-resolution pixel.',deterministic_frame_timestamps:true,real_time_capture:false,encoder:'WebCodecs AVC/AAC + local MP4 muxer'};
};
</script></html>
