<!doctype html><html lang="ko"><meta charset="utf-8"><title>국감 라이브 · 합성 데모 모션 원본</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#071329}canvas{display:block;width:1080px;height:1920px}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),W=1080,H=1920;
const C={navy:'#071329',blue:'#143D73',mint:'#64E5D0',white:'#F6FBFF',muted:'#AEC7DF',stroke:'#365B82'};
const font='"Malgun Gothic","Noto Sans KR",sans-serif';
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
let brand;
function round(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke();}}
function text(value,x,y,size=48,color=C.white,weight=600,align='left'){g.fillStyle=color;g.font=`${weight} ${size}px ${font}`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(value,x,y);}
function lines(values,x,y,size=96,color=C.white,gap=1.27){values.forEach((v,i)=>text(v,x,y+i*size*gap,size,Array.isArray(color)?color[i]:color,700));}
function pill(value,x,y,w,color=C.mint,bg='#1C4559'){round(x,y,w,56,28,bg);text(value,x+w/2,y+38,27,color,600,'center');}
function rule(x,y,w,color=C.stroke){g.fillStyle=color;g.fillRect(x,y,w,2);}
function iconDot(x,y,r=8,color=C.mint){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill();}
function shell(x,y,w,h,title){g.save();g.shadowColor='#0008';g.shadowBlur=42;g.shadowOffsetY=24;round(x,y,w,h,34,'#102841',C.stroke);g.restore();iconDot(x+33,y+38);text(title,x+57,y+48,27,C.muted,600);pill('가상 데모',x+w-174,y+14,148,'#B9F7EB','#1E4B5F');rule(x+26,y+76,w-52);}
function card(x,y,w,h,label,body,{color=C.mint,bg='#132E4F',small=false}={}){round(x,y,w,h,24,bg);text(label,x+28,y+44,27,color,600);const a=Array.isArray(body)?body:[body];a.forEach((v,i)=>text(v,x+28,y+97+i*52,small?32:38,C.white,500));}
function fadeEnter(p,callback,delay=0){const v=ease((p-delay)/.65);g.save();g.globalAlpha=v;g.translate(0,45*(1-v));callback();g.restore();}
function bg(t){const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#061226');grad.addColorStop(1,'#153F77');g.fillStyle=grad;g.fillRect(0,0,W,H);const glow=g.createRadialGradient(850+30*Math.sin(t*.2),600,10,850,600,740);glow.addColorStop(0,'#2A6EBD33');glow.addColorStop(1,'#153F7700');g.fillStyle=glow;g.fillRect(0,0,W,H);g.strokeStyle='#6DA3D30A';g.lineWidth=1;for(let y=280;y<1700;y+=80){g.beginPath();g.moveTo(70,y);g.lineTo(1010,y);g.stroke();}for(let x=80;x<1080;x+=80){g.beginPath();g.moveTo(x,280);g.lineTo(x,1660);g.stroke();}}
function header(t){if(brand)g.drawImage(brand,80,104,78,78);text('국감 라이브',180,160,44,C.white,700);pill('합성 데모',814,116,184,C.mint,'#183E5C');g.fillStyle='#345572';g.fillRect(82,222,916,4);g.fillStyle=C.mint;g.fillRect(82,222,916*Math.min(1,t/30),4);}
function scene0(p){fadeEnter(p,()=>{pill('WINDOWS · 국감 모니터링',82,304,470);lines(['코딩을 몰라도,','내 ChatGPT','계정으로.'],80,520,106,[C.white,C.white,C.mint]);},0);fadeEnter(p,()=>{shell(82,1010,916,370,'내 계정으로 시작하는 업무 흐름');card(112,1116,856,206,'모니터링 · 기록 · 검토',['복잡한 개발 과정 대신,','회의 내용을 읽는 일에 집중하세요.'],{small:true});},.35);}
function scene1(p){fadeEnter(p,()=>{lines(['국회 자막을','한곳에 모으고'],82,444,100,[C.white,C.mint]);text('기록의 흐름을 놓치지 않도록',86,700,36,C.muted,500);});fadeEnter(p,()=>{shell(82,800,916,616,'가상 회의 · 자막 기록');const rows=[['10:02','질의 의원','자료 제출 계획을 설명해 주세요.'],['10:03','답변 기관','검토 후 제출 일정을 안내하겠습니다.'],['10:04','질의 의원','추가 자료도 함께 요청합니다.']];rows.forEach((r,i)=>{const a=ease((p-.5-i*.45)/.6);g.save();g.globalAlpha=a;g.translate(0,30*(1-a));round(110,904+i*155,860,132,20,i===1?'#194465':'#0B203A');text(r[0],134,943+i*155,24,C.muted,500);text(r[1],230,943+i*155,27,i===1?'#95C8F9':C.mint,600);text(r[2],134,997+i*155,31,C.white,500);g.restore();});},.25);}
function scene2(p){fadeEnter(p,()=>{lines(['화자·질의·답변을','흐름대로'],82,444,88,[C.white,C.mint]);text('누가 묻고, 어떻게 답했는지',86,688,36,C.muted,500);});fadeEnter(p,()=>{shell(82,785,916,636,'질의별 정리');card(112,890,856,178,'질의 의원',['자료 제출 계획을 설명해 주세요.']);card(112,1096,856,178,'답변 기관',['검토 후 제출 일정을 안내합니다.'],{color:'#9CCBFA',bg:'#1B4666'});pill('원문 연결',130,1312,180);pill('역할 확인 필요 표시',330,1312,310,'#FFDE9B','#51472E');},.25);}
function scene3(p){fadeEnter(p,()=>{lines(['요약부터','후속 조치까지'],82,444,100,[C.white,C.mint]);text('핵심을 보고, 다음 할 일을 확인하세요',86,700,35,C.muted,500);});fadeEnter(p,()=>{shell(82,794,916,640,'가상 질의 · 검토할 항목');card(112,902,856,176,'AI 요약 초안',['제출 일정과 추가 자료 요청을 검토'],{small:true});round(112,1104,856,116,22,'#173B56');round(140,1143,34,34,8,null,C.mint);text('자료 요구 · 제출 일정 확인',200,1176,34);round(112,1244,856,116,22,'#173B56');round(140,1283,34,34,8,null,C.mint);text('후속 조치 · 검토할 항목 모아보기',200,1316,32);},.25);}
function scene4(p){fadeEnter(p,()=>{lines(['원문을 대조하고,','보고서로 내보내기'],82,444,88,[C.white,C.mint]);text('AI 초안은 확인한 뒤 활용하세요',86,688,36,C.muted,500);});fadeEnter(p,()=>{shell(82,786,916,634,'원문과 보정 초안');card(112,895,856,168,'원문',['검토 후 제출 일정을 안내하겠습니다.'],{small:true});card(112,1087,856,168,'AI 정리 초안',['제출 일정을 검토 후 안내하겠다고 답변'],{small:true,bg:'#1A465E'});['문서','HTML','데이터'].forEach((v,i)=>pill(v,145+i*270,1300,240,C.white,'#27577B'));},.25);}
function scene5(p){fadeEnter(p,()=>{g.save();g.shadowColor='#32CDBA55';g.shadowBlur=80;if(brand)g.drawImage(brand,398,330,284,284);g.restore();text('국감 라이브',540,798,112,C.white,700,'center');text('담당자의 시간은,',540,992,72,C.white,700,'center');text('회의 내용에.',540,1104,88,C.mint,700,'center');},0);fadeEnter(p,()=>{pill('Windows 앱 · 내 계정으로 시작',158,1246,764,C.white,'#27557C');text('로컬 모델·API 연결도 선택',540,1406,31,C.muted,500,'center');},.6);}
const captions=[
 [.75,4.05,['코딩을 몰라도, 내 ChatGPT 계정으로.']],
 [4.05,6.05,['국감 모니터링을 시작하세요.']],
 [6.05,10.25,['자막을 모으고,','화자와 질의 답변을 정리합니다.']],
 [10.25,14.05,['핵심 요약과 자료 요구,','후속 조치도 한눈에.']],
 [14.05,20,['원문과 AI 초안을 대조하고,','검토한 기록을 보고서로 내보내세요.']],
 [20,23.033,['국감 라이브.','담당자의 시간은, 회의 내용에.']]
];
window.drawFrame=function(t){bg(t);header(t);const durations=[0,5,10,14.5,19.5,24,30],scenes=[scene0,scene1,scene2,scene3,scene4,scene5];let index=5;for(let i=0;i<6;i++)if(t>=durations[i]&&t<durations[i+1]){index=i;break;}const p=t-durations[index],left=durations[index+1]-t,alpha=Math.min(1,p/.22,left/.22);g.save();g.globalAlpha=Math.max(0,alpha);scenes[index](p);g.restore();const cap=captions.find(c=>t>=c[0]&&t<c[1]);if(cap){const height=cap[2].length===1?94:154;round(74,1528,932,height,24,'#03101DDA');cap[2].forEach((line,i)=>text(line,540,1590+i*54,38,C.white,600,'center'));}rule(82,1754,916);text('비공식 업무 지원 앱 · 합성 데모',82,1804,28,C.muted,500);text('AI 결과에는 오류가 있을 수 있어 원문 확인이 필요합니다.',82,1850,26,C.muted,500);};
window.prepare=async data=>{brand=new Image();await new Promise((ok,bad)=>{brand.onload=ok;brand.onerror=bad;brand.src='data:image/png;base64,'+data;});await document.fonts.ready;window.drawFrame(1);};
window.recordVideo=async()=>{const stream=canvas.captureStream(30),chunks=[];const recorder=new MediaRecorder(stream,{mimeType:'video/mp4;codecs=avc1.42001E',videoBitsPerSecond:5500000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const complete=new Promise(ok=>recorder.onstop=ok);recorder.start(1000);const start=performance.now();await new Promise(resolve=>{function tick(now){const t=(now-start)/1000;window.drawFrame(Math.min(t,29.999));if(t>=30){recorder.stop();resolve();return;}requestAnimationFrame(tick);}requestAnimationFrame(tick);});await complete;stream.getTracks().forEach(track=>track.stop());const blob=new Blob(chunks,{type:'video/mp4'});return new Promise(ok=>{const reader=new FileReader();reader.onload=()=>ok(reader.result.split(',')[1]);reader.readAsDataURL(blob);});};
</script></html>
