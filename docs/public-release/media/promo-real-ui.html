const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),W=1080,H=1920;

function mixRect(a,b,p){return a.map((v,i)=>v+(b[i]-v)*p);}
function picture(id,crop,box,alpha=1){const image=photos[id];if(!image)return;const[x,y,w,h]=box;g.save();g.globalAlpha*=alpha;g.shadowColor='#0008';g.shadowBlur=38;g.shadowOffsetY=18;round(x,y,w,h,26,'#F7F9FC',C.stroke);g.shadowBlur=0;g.shadowOffsetY=0;g.beginPath();g.roundRect(x+2,y+2,w-4,h-4,24);g.clip();const scale=Math.min((w-4)/crop[2],(h-4)/crop[3]),dw=crop[2]*scale,dh=crop[3]*scale;g.drawImage(image,...crop,x+(w-dw)/2,y+(h-dh)/2,dw,dh);g.restore();}
function background(t){const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#061226');grad.addColorStop(1,'#153F77');g.fillStyle=grad;g.fillRect(0,0,W,H);const glow=g.createRadialGradient(850,680,10,850,680,760);glow.addColorStop(0,'#2677BF30');glow.addColorStop(1,'#153F7700');g.fillStyle=glow;g.fillRect(0,0,W,H);if(brand)g.drawImage(brand,72,91,76,76);text('국감 라이브',168,147,43,C.white,700);pill('실제 앱 · 가상 자료',728,105,284);g.fillStyle='#345572';g.fillRect(74,207,932,3);g.fillStyle=C.mint;g.fillRect(74,207,932*clamp(t/30),3);}
function label(v,y){text(v,82,y,33,C.muted,500);}
function sceneConnection(t){heading(['코딩을 몰라도,','내 ChatGPT','계정으로.'],372,94);label('앱에서 연결한 내 계정으로',742);const p=ease((t-.6)/2.6);picture('connection',mixRect(config.crops.connectionWide,config.crops.connectionFocus,p),[72,788,936,610]);}
function sceneSetup(t){heading(['자막부터 녹음까지,','필요한 방식으로'],383,82);label('실제 앱의 수집 방식 선택 화면',645);picture('captionSetup',config.crops.captionChoice,[72,718,936,340]);picture('recordingSetup',config.crops.recordingChoice,[72,1110,936,340]);}
function sceneDialogue(t){heading(['누가 묻고,','어떻게 답했는지'],383,90);label('화자와 문답을 흐름대로',655);picture('dialogue',config.crops.dialogueContext,[72,729,936,300]);const p=ease((t-6.5)/3.3);picture('dialogue',mixRect(config.crops.dialogueFocusStart,config.crops.dialogueFocusEnd,p),[72,1091,936,342]);}
function sceneSummary(t){heading(['핵심 요약과','다음 할 일을'],383,90);label('요약 · 자료 요구 · 후속 조치',655);if(photos.summary&&t<12.6){picture('summary',config.crops.summaryContext,[72,729,936,230]);picture('summary',config.crops.summary,[72,1018,936,415]);}else{const p=ease((t-12.6)/1.3);picture('followups',mixRect(config.crops.followupsWide,config.crops.followupsFocus,p),[72,729,936,704]);}}
function sceneCompare(t){heading(['원문과 AI 초안을','대조하고 검토하기'],383,84);label('AI 결과는 원문과 함께 확인하세요',655);if(photos.corrected){picture('corrected',config.crops.correctedHeader,[72,729,936,142]);picture('corrected',config.crops.corrected,[72,913,936,520]);}else{picture('dialogue',config.crops.dialogueContext,[72,729,936,300]);picture('dialogue',config.crops.dialogueFocusEnd,[72,1091,936,342]);}}
function sceneExport(t){heading(['검토한 기록은','보고서로 내보내기'],383,84);label('실제 앱의 내보내기 메뉴',655);picture('export',config.crops.exportContext,[72,729,936,704],.4);const p=ease((t-17.1)/1.3);picture('export',config.crops.exportMenu,[243-8*p,760,594+16*p,688+18*p]);}
function sceneOutro(t){if(t<24){heading(['국감 라이브.','담당자의 시간은,','회의 내용에.'],375,88);picture('overview',config.crops.overviewHeader,[72,800,936,282]);picture('overview',config.crops.dialogueContext,[72,1130,936,300]);}else{if(brand)g.drawImage(brand,424,300,232,232);text('국감 라이브',540,718,110,C.white,700,'center');text('담당자의 시간은, 회의 내용에.',540,842,46,C.mint,600,'center');picture('overview',config.crops.overviewFull,[72,944,936,492]);text('Windows 앱 · 내 계정으로 시작',540,1492,34,C.white,600,'center');}}
const captions=[[.75,4.05,['코딩을 몰라도, 내 ChatGPT 계정으로.']],[4.05,6.05,['국감 모니터링을 시작하세요.']],[6.05,10.25,['자막을 모으고,','화자와 질의 답변을 정리합니다.']],[10.25,14.05,['핵심 요약과 자료 요구,','후속 조치도 한눈에.']],[14.05,20,['원문과 AI 초안을 대조하고,','검토한 기록을 보고서로 내보내세요.']],[20,23.033,['국감 라이브.','담당자의 시간은, 회의 내용에.']],[27,30.1,['Windows 국감 모니터링 앱','AI 초안은 원문 확인이 필요합니다.']]];
window.drawFrame=t=>{background(t);const segments=[[0,4.05,sceneConnection],[4.05,6.05,sceneSetup],[6.05,10.25,sceneDialogue],[10.25,14.05,sceneSummary],[14.05,17,sceneCompare],[17,20,sceneExport],[20,30.2,sceneOutro]];const s=segments.find(([a,b])=>t>=a&&t<b)||segments.at(-1);const alpha=Math.min(1,Math.max(0,(t-s[0])/.18),Math.max(0,(s[1]-t)/.18));g.save();g.globalAlpha=alpha;s[2](t);g.restore();const cap=captions.find(([a,b])=>t>=a&&t<b);if(cap){round(70,1530,940,cap[2].length===1?94:154,24,'#03101DE8');cap[2].forEach((line,i)=>text(line,540,1591+i*54,38,C.white,600,'center'));}g.fillStyle=C.stroke;g.fillRect(74,1753,932,2);text('실제 설치 앱 화면 · 가상 시연 자료',76,1803,29,C.muted,500);text('비공식 업무 지원 앱 · AI 초안은 원문 확인이 필요합니다.',76,1850,25,C.muted,500);};
async function decodeImage(encoded){const im=new Image(),mime=typeof encoded==='string'?'image/png':encoded.mime,data=typeof encoded==='string'?encoded:encoded.data;await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=`data:${mime};base64,${data}`;});return im;}
window.prepare=async payload=>{config=payload.config;for(const[id,value]of Object.entries(payload.images))photos[id]=await decodeImage(value);brand=await decodeImage(payload.brand);if(payload.audio){const binary=atob(payload.audio),raw=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)raw[i]=binary.charCodeAt(i);audioBuffer=await new OfflineAudioContext(2,1,48000).decodeAudioData(raw.buffer);}await document.fonts.ready;window.drawFrame(2);return{audio_seconds:audioBuffer?.duration,photos:Object.keys(photos)};};
window.recordVideo=async()=>{if(!audioBuffer)throw new Error('기존 영상의 음성이 준비되지 않았습니다.');const context=new AudioContext({sampleRate:48000}),destination=context.createMediaStreamDestination(),source=context.createBufferSource();source.buffer=audioBuffer;source.connect(destination);await context.resume();const video=canvas.captureStream(30),stream=new MediaStream([...video.getVideoTracks(),...destination.stream.getAudioTracks()]);const mime=['video/mp4;codecs=avc1.42001E,mp4a.40.2','video/mp4'].find(value=>MediaRecorder.isTypeSupported(value));if(!mime)throw new Error('이 브라우저에 MP4 녹화 지원이 없습니다.');const chunks=[],recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6200000,audioBitsPerSecond:192000});const complete=new Promise((ok,bad)=>{recorder.onstop=ok;recorder.onerror=bad;});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};try{recorder.start(1000);const start=context.currentTime;source.start(start);await new Promise(ok=>{function tick(){const t=context.currentTime-start;window.drawFrame(Math.max(0,Math.min(t,audioBuffer.duration)));if(t>=audioBuffer.duration){recorder.stop();ok();}else requestAnimationFrame(tick);}requestAnimationFrame(tick);});await complete;const blob=new Blob(chunks,{type:'video/mp4'});const encoded=await new Promise(ok=>{const reader=new FileReader();reader.onload=()=>ok(reader.result.split(',')[1]);reader.readAsDataURL(blob);});return{encoded,mime,audio_seconds:audioBuffer.duration,speaker_playback:false};}finally{try{source.stop();}catch{}stream.getTracks().forEach(track=>track.stop());video.getTracks().forEach(track=>track.stop());await context.close();}};
</script></html>
