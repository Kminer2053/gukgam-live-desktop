async function decodeImage(item){const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=`data:${item.mime};base64,${item.data}`;});return im;}
async function decodeAudio(encoded){const binary=atob(encoded),raw=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)raw[i]=binary.charCodeAt(i);return new OfflineAudioContext(2,1,48000).decodeAudioData(raw.buffer);}
function rawBytes(encoded){const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;}
function buildTimeline(durations,seconds=null){let cursor=config.lead_seconds;timeline=config.clips.map((clip,index)=>{const row={...clip,index,start:cursor,end:cursor+durations[index]};cursor=row.end+(index<config.clips.length-1?config.gap_seconds:0);return row;});const total=seconds??Math.ceil((cursor+config.tail_seconds)*config.fps)/config.fps;if(total<cursor||total>cursor+10)throw Error('Use the completed introduction audio with this timeline.');timeline.forEach((row,i)=>{row.scene_start=i===0?0:(timeline[i-1].end+row.start)/2;row.scene_end=i===timeline.length-1?total:(row.end+timeline[i+1].start)/2;});return total;}
function reuseReferenceTimeline(seconds){const cached=config.reference_timeline;if(!cached)return;if(cached.fps!==config.fps||Math.abs(cached.seconds-seconds)>1e-6||cached.clips.length!==config.clips.length)throw Error('Reference timeline does not match the completed audio.');cached.clips.forEach((row,i)=>{if(!['start','end','scene_start','scene_end'].every(k=>Number.isFinite(row[k]))||row.start<row.scene_start||row.end<row.start||row.scene_end<row.end||row.scene_start<0||row.scene_end>seconds+1e-6||i===0&&row.scene_start!==0||i>0&&row.scene_start!==cached.clips[i-1].scene_end)throw Error('Invalid reference timing');});timeline=config.clips.map((clip,index)=>({...clip,index,...cached.clips[index]}));}
async function mixAudio(clips,music){const seconds=buildTimeline(clips.map(x=>x.duration)),ctx=new OfflineAudioContext(2,Math.round(seconds*48000),48000);

window.prepareFilm=async payload=>{config=payload.config;for(const[id,item]of Object.entries(payload.images))images[id]=await decodeImage(item);brand=await decodeImage(payload.brand);if(payload.encodedAudio){const source=payload.encodedAudio;encodedAudio={channels:source.channels,timescale:source.timescale,description:rawBytes(source.description),samples:source.samples.map(x=>({...x,data:rawBytes(x.data)}))};audioBuffer={duration:source.video_seconds,length:Math.round(source.video_seconds*48000)};buildTimeline(config.clips.map(x=>x.seconds),audioBuffer.duration);reuseReferenceTimeline(audioBuffer.duration);audioInfo={seconds:audioBuffer.duration,playback_rate:1,reused_completed_audio:true,reused_reference_timeline:!!config.reference_timeline,encoded_aac_sha256:source.encoded_sha256,aac_reencoded:false,speaker_playback:false};}else{const clips=[];for(const clip of payload.clips)clips.push(await decodeAudio(clip));audioBuffer=await mixAudio(clips,await decodeAudio(payload.music));}await document.fonts.ready;return{audio:audioInfo,timeline,frames:Math.round(audioBuffer.duration*config.fps),fps:config.fps};};

 await encoder.flush();encoder.close();if(failed)throw failed;if(!track.samples.length)throw Error('AAC output is empty');const first=track.samples[0].timestamp,trim=Math.max(0,Math.round(-first*48000/1e6));if(first>2)throw Error('AAC starts late');for(let i=0;i<track.samples.length;i++){const sample=track.samples[i];if(!sample.data.length||Math.abs(sample.timestamp-(first+i*1024*1e6/48000))>2)throw Error('AAC gap or duplicate timestamp');}if(track.samples.length*1024<audioBuffer.length+trim)throw Error('AAC output is incomplete');encodedAudio=track;return track;

function thumbnailHash(){small.drawImage(canvas,0,0,96,54);const pixels=[small.getImageData(0,0,96,54).data,g.getImageData(54,126,canvas.width-108,3).data];let hash=2166136261;for(const bytes of pixels)for(const b of bytes)hash=Math.imul(hash^b,16777619);return(hash>>>0).toString(16).padStart(8,'0');}
window.encodeFilm=async format=>{const geo=geometry(format),fps=config.fps,frames=Math.round(audioBuffer.duration*fps),seconds=frames/fps,track={width:geo.width,height:geo.height,timescale:90000,samples:[]},hashes=[];let failed;
