function title(number,lines,p){text(number,60,343,152,'#305F87',800);const e=ease(p/.2);g.save();g.globalAlpha=e;g.translate(35*(1-e),0);lines.forEach((line,i)=>text(line,66,425+i*105,88,i===lines.length-1?C.mint:C.white,700));g.restore();}
function small(v,y){text(v,68,y,34,C.muted,500);}
function hook(p){text('내 GPT로,',64,365,116,C.white,800);text('국감 정리 시작.',64,505,108,C.mint,800);const labels=['찾고','훑고','정리하고'];labels.forEach((v,i)=>{const e=ease((p-i*.13)/.2);g.save();g.globalAlpha=e;round(66+i*320,580,292,70,35,i===Math.min(2,Math.floor(p*3))?'#2C6C7A':'#183E5E');text(v,212+i*320,629,35,i===Math.min(2,Math.floor(p*3))?C.mint:C.white,700,'center');g.restore();});photo('account',config.crops.accountContext,[62,740,956,315]);const z=ease((p-.18)/.65);photo('account',config.crops.accountFocus,[130-50*z,1120,820+100*z,350]);text('계정 사용 설정',64,1550,34,C.muted,500);}
function search(p){title('01',['원하는 발언,','검색으로 바로.'],p);photo('search',config.crops.searchContext,[62,654,956,370]);const e=ease((p-.12)/.35);g.save();g.translate(40*(1-e),0);g.globalAlpha=e;photo('search',config.crops.searchBox,[62,1080,956,138]);round(59,1077,962,144,26,null,C.mint);g.restore();const k=ease((p-.4)/.4);photo('search',config.crops.keyword,[62,1290,956,170]);g.save();g.globalAlpha=k;text('검색어가 있는 바로 그 문장',66,1546,38,C.mint,700);g.restore();}
function scrub(p){title('02',['긴 기록도,','필요한 순간으로.'],p);const atEnd=p>=.5,id=atEnd?'timelineEnd':'timelineStart';photo(id,config.crops[atEnd?'timelineEndContext':'timelineStartContext'],[62,654,956,380]);small('시간 막대로 빠르게 탐색',1110);photo(id,config.crops.timelineBar,[62,1160,956,100]);g.strokeStyle=C.mint;g.lineWidth=5;g.beginPath();g.arc(121+Math.round(ease(p)*785),1210,29,0,Math.PI*2);g.stroke();photo(id,config.crops[atEnd?'timelineEndFocus':'timelineStartFocus'],[62,1330,956,160]);text('처음에서 끝까지, 원하는 대목을 빠르게',66,1572,35,C.mint,600);}
function summary(p){title('03',['질의별 핵심 요약,','질의자별로 한눈에.'],p);photo('summary',config.crops.summaryTabs,[62,654,956,118]);photo('summary',config.crops.memberHeading,[62,795,956,118]);const e=ease(p/.32),w=900+56*e;photo('summary',config.crops.summaryFirstPoint,[(W-w)/2,950+22*(1-e),w,320]);text('질문 요지',68,1370,64,C.white,700);text('답변 핵심',68,1470,64,C.mint,700);}
function followup(p){title('04',['자료 요구와 약속,','한곳에서 관리.'],p);photo('followups',config.crops.followupHeading,[62,654,956,100]);const a=ease((p-.1)/.3),b=ease((p-.4)/.3);g.save();g.translate(60*(1-a),0);photo('followups',config.crops.request,[62,825,956,260],a);g.restore();g.save();g.translate(-60*(1-b),0);photo('followups',config.crops.promise,[62,1175,956,260],b);g.restore();text('요구한 자료 · 제출 약속 · 처리 상태',66,1546,36,C.mint,600);}
function exporting(p){title('05',['정리한 기록,','바로 보고서로.'],p);const e=ease(p);photo('export',config.crops.exportMenu,[245-30*e,650,590+60*e,800+45*e]);text('문서 · HTML · 데이터',540,1550,46,C.mint,700,'center');}
function closing(p){const e=ease(p/.16);g.save();g.globalAlpha=.85;photo('search',config.crops.searchBox,[62,282+10*Math.sin(p*4),956,125]);photo('timelineEnd',config.crops.timelineEndFocus,[62,470+12*Math.sin(p*3+1),956,130]);photo('summary',config.crops.summaryFirstPoint,[62,670+10*Math.sin(p*5+2),956,200]);g.restore();const lines=['바이브코딩 몰라도','내 GPT 계정으로','국정감사 회의록 정리'];lines.forEach((v,i)=>{g.save();g.globalAlpha=ease((p-i*.08)/.2);text(v,64,1060+i*122,86,i===2?C.mint:C.white,800);g.restore();});text('검색 · 빠른 탐색 · 요약 · 후속조치',64,1515,36,C.muted,600);text('국감 라이브',64,1630,58,C.white,700);}
const renderers=[hook,search,scrub,summary,followup,exporting,closing];
window.drawFrame=t=>{background(t);const current=timeline.find(x=>t>=x.scene_start&&t<x.scene_end)||timeline.at(-1);if(!current)return;const span=current.scene_end-current.scene_start,p=clamp((t-current.scene_start)/span),alpha=current.index===0?1:Math.min(1,(t-current.scene_start)/.14,(current.scene_end-t)/.14);g.save();g.globalAlpha=Math.max(0,alpha);renderers[current.index](p);g.restore();if(current.index!==6&&t>=current.start&&t<current.end){const lines=config.clips[current.index].caption;round(52,1680,976,lines.length===1?95:150,24,'#020E1FEF');lines.forEach((line,i)=>text(line,540,1740+i*52,36,C.white,600,'center'));}};
async function decodeImage(item){const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=`data:${item.mime};base64,${item.data}`;});return im;}
async function decodeAudio(encoded){const binary=atob(encoded),raw=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)raw[i]=binary.charCodeAt(i);return new OfflineAudioContext(2,1,48000).decodeAudioData(raw.buffer);}
function buildTimeline(durations,endOverride=null){let cursor=config.lead_seconds;timeline=durations.map((duration,index)=>{const row={index,start:cursor,end:cursor+duration};cursor=row.end+(index<durations.length-1?config.gap_seconds:0);return row;});const seconds=endOverride??Math.max(35,cursor+config.tail_seconds);if(seconds<34.8||seconds>40.7)throw Error('Use completed product-tour audio between 35 and 40 seconds.');timeline.forEach((row,i)=>{row.scene_start=i===0?0:(timeline[i-1].end+row.start)/2;row.scene_end=i===timeline.length-1?seconds:(row.end+timeline[i+1].start)/2;});return seconds;}
async function mixAudio(clips,music){const seconds=buildTimeline(clips.map(x=>x.duration));const ctx=new OfflineAudioContext(2,Math.ceil(seconds*48000),48000);const connect=(buffer,when,offset,length,volume,fadeIn=0,fadeOut=0)=>{const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=buffer;source.playbackRate.value=1;source.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(fadeIn?0:volume,when);if(fadeIn)gain.gain.linearRampToValueAtTime(volume,when+fadeIn);if(fadeOut){gain.gain.setValueAtTime(volume,when+length-fadeOut);gain.gain.linearRampToValueAtTime(0,when+length);}source.start(when,offset,length);};clips.forEach((clip,index)=>{let peak=0;for(let ch=0;ch<clip.numberOfChannels;ch++)for(const value of clip.getChannelData(ch))peak=Math.max(peak,Math.abs(value));if(peak<.005)throw Error('Empty narration clip.');connect(clip,timeline[index].start,0,clip.duration,.5/peak);});if(music.duration<29.6)throw Error('Pinned music source too short.');for(let start=0;start<seconds;start+=5.15){const length=Math.min(5.6,seconds-start),fade=Math.min(.45,length/3);connect(music,start,24,length,.52,Math.min(start===0?.2:fade,length/3),fade);}const buffer=await ctx.startRendering();let peak=0,power=0,clipped=0;for(let ch=0;ch<buffer.numberOfChannels;ch++)for(const value of buffer.getChannelData(ch)){peak=Math.max(peak,Math.abs(value));power+=value*value;if(Math.abs(value)>=1)clipped++;}audioMetadata={seconds:buffer.duration,clips:timeline,source_music_seconds:[24,29.6],playback_rate:1,time_stretch:false,sample_peak_dbfs:20*Math.log10(peak),rms_dbfs:10*Math.log10(power/(buffer.length*buffer.numberOfChannels)),samples_at_or_above_full_scale:clipped,measurement:'Rendered PCM sample peak/RMS; not true peak or LUFS.',new_tts_generation:0,speaker_playback:false};return buffer;}
window.prepare=async payload=>{config=payload.config;for(const[id,item]of Object.entries(payload.images))images[id]=await decodeImage(item);brand=await decodeImage(payload.brand);if(payload.sourceAudio){audioBuffer=await decodeAudio(payload.sourceAudio);buildTimeline(config.clips.map(x=>x.seconds),audioBuffer.duration);audioMetadata={seconds:audioBuffer.duration,clips:timeline,reused_completed_audio:true,playback_rate:1,time_stretch:false,new_tts_generation:0,speaker_playback:false};}else{const clips=[];for(const item of payload.clips)clips.push(await decodeAudio(item));audioBuffer=await mixAudio(clips,await decodeAudio(payload.music));}await document.fonts.ready;window.drawFrame(.8);return audioMetadata;};
window.recordVideo=async()=>{const context=new AudioContext({sampleRate:48000}),dest=context.createMediaStreamDestination(),source=context.createBufferSource();source.buffer=audioBuffer;source.connect(dest);await context.resume();window.drawFrame(.8);const video=canvas.captureStream(30),stream=new MediaStream([...video.getVideoTracks(),...dest.stream.getAudioTracks()]),mime=['video/mp4;codecs=avc1.42001E,mp4a.40.2','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('MP4 encoder unavailable.');const chunks=[],recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000,audioBitsPerSecond:192000}),finished=new Promise((ok,bad)=>{recorder.onstop=ok;recorder.onerror=bad;});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};try{recorder.start(1000);const start=context.currentTime;source.start(start);await new Promise(ok=>{function tick(){const t=context.currentTime-start;window.drawFrame(Math.min(t,audioBuffer.duration-.001));if(t>=audioBuffer.duration){recorder.stop();ok();}else requestAnimationFrame(tick);}requestAnimationFrame(tick);});await finished;const encoded=await new Promise(ok=>{const reader=new FileReader();reader.onload=()=>ok(reader.result.split(',')[1]);reader.readAsDataURL(new Blob(chunks,{type:'video/mp4'}));});return{encoded,mime,seconds:audioBuffer.duration};}finally{try{source.stop();}catch{}stream.getTracks().forEach(x=>x.stop());video.getTracks().forEach(x=>x.stop());await context.close();}};
