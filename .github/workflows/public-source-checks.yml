name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GUKGAM_ALLOW_ASSEMBLY_NETWORK: '0'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the pinned desktop graph without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply the reviewed build compatibility changes
        run: npm run prebuild
      - name: Run synthetic lifecycle and download security contracts
        run: npm test
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Build the desktop shell without installing or starting the app
        run: npm run build
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      GUKGAM_TEST_NETWORK: '0'
      GUKGAM_TEST_MLX: '0'
      GUKGAM_TEST_NEMOTRON: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned Windows dependency graph
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-desktop.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run all public synthetic Python tests
        run: python -m pytest -q
      - name: Build the Windows engine
        run: python scripts/build_desktop_engine.py
      - name: Check the frozen engine entry point without opening a record
        shell: pwsh
        run: |
          & .\dist\engine\gukgam-engine\gukgam-engine.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
