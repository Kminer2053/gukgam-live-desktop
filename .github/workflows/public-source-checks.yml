name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GUKGAM_ALLOW_ASSEMBLY_NETWORK: '0'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the pinned desktop graph without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply the reviewed build compatibility changes
        run: npm run prebuild
      - name: Diagnose Windows paths and prepare canonical synthetic fixtures
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const os = require('node:os');
          const equal = (a, b) => path.resolve(a).toLowerCase() === path.resolve(b).toLowerCase();
          async function chain(start) {
            const rows = [];
            for (let current = path.resolve(start); ; current = path.dirname(current)) {
              const info = await fs.lstat(current), actual = await fs.realpath(current);
              rows.push({path: current, actual, directory: info.isDirectory(), link: info.isSymbolicLink(), canonical: equal(current, actual)});
              if (path.dirname(current) === current) return rows;
            }
          }
          (async () => {
            if (process.platform !== 'win32') throw Error('Windows fixture preparation requires Windows.');
            const original = os.tmpdir(), originalChain = await chain(original);
            console.log(JSON.stringify({node: process.version, originalTmp: original, originalPathChecks: originalChain}));
            const runner = process.env.RUNNER_TEMP;
            if (!runner || !path.isAbsolute(runner)) throw Error('The runner temporary directory is unavailable.');
            // Only synthetic tests use this new canonical directory; production guards stay unchanged.
            const parent = await fs.realpath(runner);
            const root = await fs.mkdtemp(path.join(parent, 'gukgam-node-fixtures-'));
            const canonical = await fs.realpath(root), checks = await chain(canonical);
            if (!checks.every(row => row.directory && !row.link && row.canonical)) throw Error('The synthetic fixture ancestors are not canonical regular directories.');
            const probe = path.join(canonical, 'identity-probe.json');
            await fs.writeFile(probe, '{"synthetic":true}', {flag: 'wx'});
            const before = await fs.lstat(probe, {bigint: true}), handle = await fs.open(probe, 'r');
            let opened;
            try { opened = await handle.stat({bigint: true}); } finally { await handle.close(); }
            const identity = before.isFile() && !before.isSymbolicLink() && before.nlink === 1n
              && before.dev === opened.dev && before.ino === opened.ino && before.size === opened.size
              && before.mode === opened.mode && before.nlink === opened.nlink
              && before.mtimeNs === opened.mtimeNs && before.ctimeNs === opened.ctimeNs;
            console.log(JSON.stringify({canonicalFixture: canonical, ancestorChecks: checks, identity,
              nlink: String(before.nlink), dev: String(before.dev), ino: String(before.ino)}));
            await fs.unlink(probe);
            if (!identity || /[\r\n]/.test(canonical)) throw Error('The synthetic fixture file identity could not be verified.');
            if (!process.env.GITHUB_ENV) throw Error('The GitHub job environment file is unavailable.');
            await fs.appendFile(process.env.GITHUB_ENV, `TEMP=${canonical}\nTMP=${canonical}\n`, 'utf8');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run synthetic lifecycle and download security contracts
        run: npm test
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Build the desktop shell without installing or starting the app
        run: npm run build
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      GUKGAM_TEST_NETWORK: '0'
      GUKGAM_TEST_MLX: '0'
      GUKGAM_TEST_NEMOTRON: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned Windows dependency graph
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-desktop.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run all public synthetic Python tests
        run: python -m pytest -q
      - name: Build the Windows engine
        run: python scripts/build_desktop_engine.py
      - name: Check the frozen engine entry point without opening a record
        shell: pwsh
        run: |
          & .\dist\engine\gukgam-engine\gukgam-engine.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
